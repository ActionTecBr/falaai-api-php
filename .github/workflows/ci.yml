name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --quiet
      - name: Syntax check (php -l, lib/**)
        run: find lib -type f -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Check autoload
        run: php -r 'require "vendor/autoload.php"; echo "ok\n";'
